<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
  <title id="t">NewsFree365 story image</title>
  <desc id="d">Default cover when no feed image is available</desc>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f9f8f"/>
      <stop offset="45%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#031f1d"/>
    </linearGradient>
    <linearGradient id="badge" x1="470" y1="140" x2="730" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f9f8f"/>
      <stop offset="0.42" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#031f1d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <g transform="translate(474 118)">
    <circle cx="126" cy="126" r="126" fill="url(#badge)"/>
    <circle cx="126" cy="126" r="112" fill="none" stroke="#ccfbf1" stroke-opacity="0.2" stroke-width="4"/>
    <g fill="#ffffff" transform="translate(126 126) rotate(-8) translate(-126 -126)">
      <rect x="82" y="55" width="24" height="142" rx="7"/>
      <rect x="146" y="55" width="24" height="142" rx="7"/>
      <rect x="58" y="86" width="136" height="24" rx="7"/>
      <rect x="58" y="142" width="136" height="24" rx="7"/>
    </g>
  </g>

  <text x="600" y="440" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="24" font-weight="500">News desk coverage</text>
</svg>
