Google Search Console Verification

To verify your site with Google Search Console:

1. Go to https://search.google.com/search-console
2. Add your property (website URL)
3. Choose "HTML tag" verification method
4. Copy the meta tag provided by Google
5. Add it to the <head> section of index.html

Example meta tag (replace with your actual verification code):
<meta name="google-site-verification" content="YOUR_VERIFICATION_CODE_HERE" />

OR use the HTML file method:
1. Download the HTML verification file from Search Console
2. Place it in the /public directory
3. The file should be accessible at: https://your-domain.com/googleXXXXXXXXXXXX.html

After verification:
- Submit your sitemap: https://your-domain.com/sitemap.xml
- Monitor indexing status
- Check Core Web Vitals
- Review search performance
